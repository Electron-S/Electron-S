<ellipse cx="450" cy="32" rx="52" ry="17" transform="rotate(-25 450 32)" fill="none" stroke="#58a6ff" opacity=".4"/>
<circle cx="450" cy="32" r="6" fill="#79c0ff" class="light"/><g class="orb"><circle cx="479" cy="32" r="3" fill="#bc9cff"/></g></svg>
