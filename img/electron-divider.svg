<svg xmlns="http://www.w3.org/2000/svg" width="900" height="64" viewBox="0 0 900 64" role="img" aria-label="Electron orbit"><title>Electron orbit</title><style>@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@keyframes orbit{to{transform:rotate(360deg)}}.orb{transform-origin:450px 32px;animation:orbit 12s linear infinite}.light{animation:pulse 4s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.orb,.light{animation:none}}</style>
